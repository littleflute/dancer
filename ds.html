<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>舞蹈脚本格式演示系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #f0f0f0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        h1 {
            font-size: 2.8rem;
            background: linear-gradient(90deg, #ff7e5f, #feb47b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #a0a0c0;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        @media (max-width: 1024px) {
            .content {
                grid-template-columns: 1fr;
            }
        }
        
        .panel {
            background: rgba(30, 30, 46, 0.8);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .panel-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #ff7e5f;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .panel-title i {
            font-size: 1.3rem;
        }
        
        #danceCanvas {
            width: 100%;
            height: 500px;
            background: #0f0f1a;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        button {
            background: linear-gradient(90deg, #ff7e5f, #feb47b);
            border: none;
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 126, 95, 0.4);
        }
        
        button.secondary {
            background: rgba(255, 255, 255, 0.1);
        }
        
        button.secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
        }
        
        .editor-container {
            height: 500px;
            position: relative;
        }
        
        #scriptEditor {
            width: 100%;
            height: 100%;
            background: #0a0a15;
            border-radius: 10px;
            padding: 15px;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            border: 1px solid rgba(255, 255, 255, 0.05);
            resize: none;
            tab-size: 2;
        }
        
        .examples {
            margin-top: 30px;
        }
        
        .examples-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .example-card {
            background: rgba(30, 30, 46, 0.8);
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .example-card:hover {
            transform: translateY(-5px);
            background: rgba(40, 40, 60, 0.9);
            border-color: rgba(255, 126, 95, 0.3);
        }
        
        .example-title {
            font-size: 1.2rem;
            color: #feb47b;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .example-desc {
            color: #a0a0c0;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        
        .time-display {
            text-align: center;
            font-size: 1.1rem;
            margin-top: 15px;
            color: #feb47b;
        }
        
        .slider-container {
            margin-top: 20px;
        }
        
        .slider-container label {
            display: block;
            margin-bottom: 8px;
            color: #a0a0c0;
        }
        
        input[type="range"] {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ff7e5f;
            cursor: pointer;
        }
        
        .status {
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            margin-top: 15px;
            background: rgba(255, 126, 95, 0.1);
            border-left: 4px solid #ff7e5f;
            display: none;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #a0a0c0;
            font-size: 0.9rem;
        }
        
        .error {
            background: rgba(255, 50, 50, 0.1);
            border-left: 4px solid #ff3232;
            color: #ff9999;
        }
        
        .success {
            background: rgba(50, 255, 100, 0.1);
            border-left: 4px solid #32ff64;
            color: #99ffb3;
        }
        
        .highlight {
            color: #ff7e5f;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>舞蹈脚本格式演示系统</h1>
            <p class="subtitle">设计一种专门用于描述人体正面站姿的舞蹈脚本格式，支持双手和头部的摆动动作。在画布上实时演示舞蹈动作，并提供示例脚本和编辑器。</p>
        </header>
        
        <div class="content">
            <div class="panel">
                <h2 class="panel-title"><i class="fas fa-play-circle"></i> 舞蹈演示</h2>
                <canvas id="danceCanvas" width="600" height="500"></canvas>
                <div class="time-display" id="timeDisplay">时间: 0ms / 4000ms</div>
                
                <div class="slider-container">
                    <label for="timeSlider">时间轴控制:</label>
                    <input type="range" id="timeSlider" min="0" max="4000" value="0" step="10">
                </div>
                
                <div class="controls">
                    <button id="playBtn"><i class="fas fa-play"></i> 播放</button>
                    <button id="pauseBtn"><i class="fas fa-pause"></i> 暂停</button>
                    <button id="resetBtn"><i class="fas fa-redo"></i> 重置</button>
                    <button id="applyScriptBtn" class="secondary"><i class="fas fa-code"></i> 应用脚本</button>
                </div>
                
                <div class="status" id="statusMessage"></div>
            </div>
            
            <div class="panel">
                <h2 class="panel-title"><i class="fas fa-edit"></i> 脚本编辑器</h2>
                <div class="editor-container">
                    <textarea id="scriptEditor" spellcheck="false"></textarea>
                </div>
                <div class="controls">
                    <button id="formatBtn" class="secondary"><i class="fas fa-indent"></i> 格式化JSON</button>
                    <button id="loadExampleBtn" class="secondary"><i class="fas fa-download"></i> 加载示例</button>
                    <button id="saveScriptBtn"><i class="fas fa-save"></i> 保存脚本</button>
                </div>
            </div>
        </div>
        
        <div class="panel examples">
            <h2 class="panel-title"><i class="fas fa-star"></i> 舞蹈示例</h2>
            <p style="margin-bottom: 15px; color: #a0a0c0;">点击下方示例加载不同的舞蹈脚本：</p>
            <div class="examples-grid" id="examplesContainer">
                <!-- 示例将通过JavaScript动态添加 -->
            </div>
        </div>
        
        <footer>
            <p>舞蹈脚本格式演示系统 | 设计用于描述人体正面站姿的双手和头部摆动动作 | 使用Canvas实现动画演示</p>
            <p style="margin-top: 10px;">脚本格式: <span class="highlight">JSON</span> | 动画类型: <span class="highlight">关键帧插值</span> | 支持动作: <span class="highlight">头部摆动、双手摆动</span></p>
        </footer>
    </div>

    <script>
        // 初始示例舞蹈脚本
        const defaultScript = {
            "name": "基础摆手舞",
            "duration": 4000,
            "fps": 30,
            "initialPosition": {
                "head": {"x": 0, "y": 0, "angle": 0},
                "leftHand": {"x": -40, "y": 0, "angle": 0},
                "rightHand": {"x": 40, "y": 0, "angle": 0}
            },
            "keyframes": [
                {"time": 0, "head": {"x": 0, "y": 0, "angle": 0}, "leftHand": {"x": -40, "y": 0, "angle": 0}, "rightHand": {"x": 40, "y": 0, "angle": 0}},
                {"time": 500, "head": {"x": 0, "y": -5, "angle": 10}, "leftHand": {"x": -60, "y": -20, "angle": 45}, "rightHand": {"x": 60, "y": 20, "angle": -45}},
                {"time": 1000, "head": {"x": 0, "y": -5, "angle": -10}, "leftHand": {"x": -60, "y": 20, "angle": -45}, "rightHand": {"x": 60, "y": -20, "angle": 45}},
                {"time": 1500, "head": {"x": 0, "y": -5, "angle": 10}, "leftHand": {"x": -60, "y": -20, "angle": 45}, "rightHand": {"x": 60, "y": 20, "angle": -45}},
                {"time": 2000, "head": {"x": 0, "y": -5, "angle": -10}, "leftHand": {"x": -60, "y": 20, "angle": -45}, "rightHand": {"x": 60, "y": -20, "angle": 45}},
                {"time": 2500, "head": {"x": 0, "y": 0, "angle": 0}, "leftHand": {"x": -40, "y": 0, "angle": 0}, "rightHand": {"x": 40, "y": 0, "angle": 0}},
                {"time": 3000, "head": {"x": 10, "y": -5, "angle": 20}, "leftHand": {"x": -30, "y": -30, "angle": 90}, "rightHand": {"x": 30, "y": -30, "angle": -90}},
                {"time": 3500, "head": {"x": -10, "y": -5, "angle": -20}, "leftHand": {"x": -30, "y": 30, "angle": -90}, "rightHand": {"x": 30, "y": 30, "angle": 90}},
                {"time": 4000, "head": {"x": 0, "y": 0, "angle": 0}, "leftHand": {"x": -40, "y": 0, "angle": 0}, "rightHand": {"x": 40, "y": 0, "angle": 0}}
            ]
        };

        // 其他示例脚本
        const exampleScripts = [
            {
                id: 1,
                name: "波浪手舞",
                description: "双手交替做出波浪动作，头部轻微跟随摆动",
                script: {
                    "name": "波浪手舞",
                    "duration": 5000,
                    "fps": 30,
                    "initialPosition": {
                        "head": {"x": 0, "y": 0, "angle": 0},
                        "leftHand": {"x": -40, "y": 0, "angle": 0},
                        "rightHand": {"x": 40, "y": 0, "angle": 0}
                    },
                    "keyframes": [
                        {"time": 0, "head": {"x": 0, "y": 0, "angle": 0}, "leftHand": {"x": -40, "y": 0, "angle": 0}, "rightHand": {"x": 40, "y": 0, "angle": 0}},
                        {"time": 800, "head": {"x": 5, "y": -3, "angle": 5}, "leftHand": {"x": -50, "y": -30, "angle": 30}, "rightHand": {"x": 30, "y": -10, "angle": -15}},
                        {"time": 1600, "head": {"x": -5, "y": -3, "angle": -5}, "leftHand": {"x": -30, "y": -10, "angle": -15}, "rightHand": {"x": 50, "y": -30, "angle": 30}},
                        {"time": 2400, "head": {"x": 5, "y": -3, "angle": 5}, "leftHand": {"x": -50, "y": -30, "angle": 30}, "rightHand": {"x": 30, "y": -10, "angle": -15}},
                        {"time": 3200, "head": {"x": -5, "y": -3, "angle": -5}, "leftHand": {"x": -30, "y": -10, "angle": -15}, "rightHand": {"x": 50, "y": -30, "angle": 30}},
                        {"time": 4000, "head": {"x": 0, "y": 0, "angle": 0}, "leftHand": {"x": -40, "y": 0, "angle": 0}, "rightHand": {"x": 40, "y": 0, "angle": 0}},
                        {"time": 5000, "head": {"x": 0, "y": 0, "angle": 0}, "leftHand": {"x": -40, "y": 0, "angle": 0}, "rightHand": {"x": 40, "y": 0, "angle": 0}}
                    ]
                }
            },
            {
                id: 2,
                name: "摇头舞",
                description: "头部大幅度左右摆动，双手轻微配合",
                script: {
                    "name": "摇头舞",
                    "duration": 3000,
                    "fps": 30,
                    "initialPosition": {
                        "head": {"x": 0, "y": 0, "angle": 0},
                        "leftHand": {"x": -40, "y": 0, "angle": 0},
                        "rightHand": {"x": 40, "y": 0, "angle": 0}
                    },
                    "keyframes": [
                        {"time": 0, "head": {"x": 0, "y": 0, "angle": 0}, "leftHand": {"x": -40, "y": 0, "angle": 0}, "rightHand": {"x": 40, "y": 0, "angle": 0}},
                        {"time": 500, "head": {"x": 15, "y": -5, "angle": 30}, "leftHand": {"x": -45, "y": -10, "angle": 15}, "rightHand": {"x": 35, "y": 10, "angle": -10}},
                        {"time": 1000, "head": {"x": -15, "y": -5, "angle": -30}, "leftHand": {"x": -35, "y": 10, "angle": -10}, "rightHand": {"x": 45, "y": -10, "angle": 15}},
                        {"time": 1500, "head": {"x": 15, "y": -5, "angle": 30}, "leftHand": {"x": -45, "y": -10, "angle": 15}, "rightHand": {"x": 35, "y": 10, "angle": -10}},
                        {"time": 2000, "head": {"x": -15, "y": -5, "angle": -30}, "leftHand": {"x": -35, "y": 10, "angle": -10}, "rightHand": {"x": 45, "y": -10, "angle": 15}},
                        {"time": 2500, "head": {"x": 0, "y": 0, "angle": 0}, "leftHand": {"x": -40, "y": 0, "angle": 0}, "rightHand": {"x": 40, "y": 0, "angle": 0}},
                        {"time": 3000, "head": {"x": 0, "y": 0, "angle": 0}, "leftHand": {"x": -40, "y": 0, "angle": 0}, "rightHand": {"x": 40, "y": 0, "angle": 0}}
                    ]
                }
            },
            {
                id: 3,
                name: "对称摆臂",
                description: "双手同时对称摆动，头部保持稳定",
                script: {
                    "name": "对称摆臂",
                    "duration": 3500,
                    "fps": 30,
                    "initialPosition": {
                        "head": {"x": 0, "y": 0, "angle": 0},
                        "leftHand": {"x": -40, "y": 0, "angle": 0},
                        "rightHand": {"x": 40, "y": 0, "angle": 0}
                    },
                    "keyframes": [
                        {"time": 0, "head": {"x": 0, "y": 0, "angle": 0}, "leftHand": {"x": -40, "y": 0, "angle": 0}, "rightHand": {"x": 40, "y": 0, "angle": 0}},
                        {"time": 700, "head": {"x": 0, "y": 0, "angle": 0}, "leftHand": {"x": -60, "y": -40, "angle": 60}, "rightHand": {"x": 60, "y": -40, "angle": -60}},
                        {"time": 1400, "head": {"x": 0, "y": 0, "angle": 0}, "leftHand": {"x": -40, "y": 0, "angle": 0}, "rightHand": {"x": 40, "y": 0, "angle": 0}},
                        {"time": 2100, "head": {"x": 0, "y": 0, "angle": 0}, "leftHand": {"x": -20, "y": -40, "angle": -60}, "rightHand": {"x": 20, "y": -40, "angle": 60}},
                        {"time": 2800, "head": {"x": 0, "y": 0, "angle": 0}, "leftHand": {"x": -40, "y": 0, "angle": 0}, "rightHand": {"x": 40, "y": 0, "angle": 0}},
                        {"time": 3500, "head": {"x": 0, "y": 0, "angle": 0}, "leftHand": {"x": -40, "y": 0, "angle": 0}, "rightHand": {"x": 40, "y": 0, "angle": 0}}
                    ]
                }
            }
        ];

        // 全局变量
        let currentScript = JSON.parse(JSON.stringify(defaultScript));
        let canvas, ctx;
        let isPlaying = false;
        let startTime = 0;
        let lastTime = 0;
        let animationId = null;
        let currentTime = 0;
        
        // DOM元素
        const scriptEditor = document.getElementById('scriptEditor');
        const danceCanvas = document.getElementById('danceCanvas');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const applyScriptBtn = document.getElementById('applyScriptBtn');
        const formatBtn = document.getElementById('formatBtn');
        const loadExampleBtn = document.getElementById('loadExampleBtn');
        const saveScriptBtn = document.getElementById('saveScriptBtn');
        const timeSlider = document.getElementById('timeSlider');
        const timeDisplay = document.getElementById('timeDisplay');
        const statusMessage = document.getElementById('statusMessage');
        const examplesContainer = document.getElementById('examplesContainer');
        
        // 初始化
        function init() {
            canvas = danceCanvas;
            ctx = canvas.getContext('2d');
            
            // 设置编辑器初始内容
            scriptEditor.value = JSON.stringify(currentScript, null, 2);
            
            // 初始化示例
            initExamples();
            
            // 绘制初始状态
            drawDancer(currentTime);
            
            // 设置事件监听
            setupEventListeners();
            
            // 显示状态消息
            showStatus("系统已就绪！加载了默认舞蹈脚本。", "success");
        }
        
        // 初始化示例
        function initExamples() {
            examplesContainer.innerHTML = '';
            
            // 添加默认示例
            const defaultExample = {
                id: 0,
                name: "基础摆手舞",
                description: "双手交替摆动，头部轻微配合的基本舞蹈动作"
            };
            
            createExampleCard(defaultExample, defaultScript);
            
            // 添加其他示例
            exampleScripts.forEach(example => {
                createExampleCard(example, example.script);
            });
        }
        
        // 创建示例卡片
        function createExampleCard(example, script) {
            const card = document.createElement('div');
            card.className = 'example-card';
            card.innerHTML = `
                <div class="example-title">
                    <i class="fas fa-music"></i>
                    ${example.name}
                </div>
                <div class="example-desc">${example.description}</div>
            `;
            
            card.addEventListener('click', () => {
                loadScript(script);
                showStatus(`已加载 "${example.name}" 舞蹈脚本`, "success");
            });
            
            examplesContainer.appendChild(card);
        }
        
        // 设置事件监听
        function setupEventListeners() {
            playBtn.addEventListener('click', playAnimation);
            pauseBtn.addEventListener('click', pauseAnimation);
            resetBtn.addEventListener('click', resetAnimation);
            applyScriptBtn.addEventListener('click', applyScript);
            formatBtn.addEventListener('click', formatJSON);
            loadExampleBtn.addEventListener('click', loadRandomExample);
            saveScriptBtn.addEventListener('click', saveScript);
            timeSlider.addEventListener('input', handleTimeSliderChange);
            
            // 窗口大小调整时重新调整Canvas
            window.addEventListener('resize', handleResize);
        }
        
        // 播放动画
        function playAnimation() {
            if (isPlaying) return;
            
            isPlaying = true;
            startTime = performance.now() - currentTime;
            lastTime = performance.now();
            
            // 更新按钮状态
            playBtn.disabled = true;
            pauseBtn.disabled = false;
            
            // 开始动画循环
            animate();
            
            showStatus("开始播放舞蹈动画", "success");
        }
        
        // 暂停动画
        function pauseAnimation() {
            if (!isPlaying) return;
            
            isPlaying = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            
            // 更新按钮状态
            playBtn.disabled = false;
            pauseBtn.disabled = true;
            
            showStatus("已暂停动画", "");
        }
        
        // 重置动画
        function resetAnimation() {
            pauseAnimation();
            currentTime = 0;
            timeSlider.value = 0;
            updateTimeDisplay();
            drawDancer(currentTime);
            
            showStatus("动画已重置到起始位置", "");
        }
        
        // 应用脚本
        function applyScript() {
            try {
                const newScript = JSON.parse(scriptEditor.value);
                
                // 验证脚本格式
                if (!newScript.name || !newScript.duration || !newScript.keyframes) {
                    throw new Error("脚本格式不正确：缺少必要字段");
                }
                
                // 验证关键帧
                if (!Array.isArray(newScript.keyframes) || newScript.keyframes.length === 0) {
                    throw new Error("脚本格式不正确：关键帧必须是数组且不能为空");
                }
                
                // 更新当前脚本
                currentScript = newScript;
                
                // 重置动画
                resetAnimation();
                
                // 更新滑块范围
                timeSlider.max = currentScript.duration;
                
                showStatus("脚本应用成功！", "success");
            } catch (error) {
                showStatus(`脚本解析错误: ${error.message}`, "error");
            }
        }
        
        // 格式化JSON
        function formatJSON() {
            try {
                const parsed = JSON.parse(scriptEditor.value);
                scriptEditor.value = JSON.stringify(parsed, null, 2);
                showStatus("JSON已格式化", "success");
            } catch (error) {
                showStatus(`JSON格式化错误: ${error.message}`, "error");
            }
        }
        
        // 加载随机示例
        function loadRandomExample() {
            const randomIndex = Math.floor(Math.random() * exampleScripts.length);
            const example = exampleScripts[randomIndex];
            loadScript(example.script);
            showStatus(`已加载随机示例: "${example.name}"`, "success");
        }
        
        // 保存脚本
        function saveScript() {
            try {
                const script = JSON.parse(scriptEditor.value);
                const scriptName = script.name || "dance_script";
                const dataStr = JSON.stringify(script, null, 2);
                const dataUri = "data:application/json;charset=utf-8," + encodeURIComponent(dataStr);
                
                const link = document.createElement('a');
                link.setAttribute('href', dataUri);
                link.setAttribute('download', `${scriptName}.json`);
                link.click();
                
                showStatus(`脚本已保存为: ${scriptName}.json`, "success");
            } catch (error) {
                showStatus(`保存脚本时出错: ${error.message}`, "error");
            }
        }
        
        // 加载脚本
        function loadScript(script) {
            currentScript = JSON.parse(JSON.stringify(script));
            scriptEditor.value = JSON.stringify(currentScript, null, 2);
            resetAnimation();
            timeSlider.max = currentScript.duration;
        }
        
        // 处理时间滑块变化
        function handleTimeSliderChange() {
            currentTime = parseInt(timeSlider.value);
            updateTimeDisplay();
            drawDancer(currentTime);
            
            // 如果正在播放，暂停
            if (isPlaying) {
                pauseAnimation();
            }
        }
        
        // 处理窗口大小变化
        function handleResize() {
            drawDancer(currentTime);
        }
        
        // 更新时间显示
        function updateTimeDisplay() {
            timeDisplay.textContent = `时间: ${currentTime}ms / ${currentScript.duration}ms`;
        }
        
        // 显示状态消息
        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = "status";
            
            if (type === "error") {
                statusMessage.classList.add("error");
            } else if (type === "success") {
                statusMessage.classList.add("success");
            }
            
            statusMessage.style.display = "block";
            
            // 3秒后隐藏
            setTimeout(() => {
                statusMessage.style.display = "none";
            }, 3000);
        }
        
        // 动画循环
        function animate() {
            if (!isPlaying) return;
            
            const now = performance.now();
            const deltaTime = now - lastTime;
            lastTime = now;
            
            currentTime = now - startTime;
            
            // 如果超过持续时间，循环播放
            if (currentTime > currentScript.duration) {
                currentTime = 0;
                startTime = now;
            }
            
            // 更新滑块
            timeSlider.value = currentTime;
            
            // 更新时间显示
            updateTimeDisplay();
            
            // 绘制当前帧
            drawDancer(currentTime);
            
            // 继续动画循环
            animationId = requestAnimationFrame(animate);
        }
        
        // 绘制舞者
        function drawDancer(time) {
            // 清除画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 计算当前姿势
            const pose = getPoseAtTime(time);
            
            // 绘制背景
            drawBackground();
            
            // 绘制参考网格（调试用）
            // drawGrid();
            
            // 绘制身体
            drawBody();
            
            // 绘制头部
            drawHead(pose.head);
            
            // 绘制双手
            drawHand(pose.leftHand, true);
            drawHand(pose.rightHand, false);
            
            // 绘制信息
            drawInfo(time);
        }
        
        // 绘制背景
        function drawBackground() {
            // 渐变背景
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, "#0a0a15");
            gradient.addColorStop(1, "#151525");
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 舞台效果
            ctx.fillStyle = "rgba(255, 255, 255, 0.03)";
            ctx.beginPath();
            ctx.ellipse(canvas.width/2, canvas.height/2 + 150, 200, 30, 0, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // 绘制网格（调试用）
        function drawGrid() {
            ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
            ctx.lineWidth = 0.5;
            
            // 垂直线
            for (let x = 0; x < canvas.width; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            
            // 水平线
            for (let y = 0; y < canvas.height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            // 中心点
            ctx.fillStyle = "rgba(255, 50, 50, 0.5)";
            ctx.beginPath();
            ctx.arc(canvas.width/2, canvas.height/2, 3, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // 绘制身体
        function drawBody() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            
            // 躯干
            ctx.fillStyle = "#4a4a6d";
            ctx.fillRect(centerX - 15, centerY - 50, 30, 100);
            
            // 肩膀
            ctx.fillStyle = "#3a3a5d";
            ctx.fillRect(centerX - 40, centerY - 50, 80, 20);
        }
        
        // 绘制头部
        function drawHead(headPose) {
            const centerX = canvas.width / 2 + headPose.x;
            const centerY = canvas.height / 2 - 100 + headPose.y;
            
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(headPose.angle * Math.PI / 180);
            
            // 头部
            ctx.fillStyle = "#ffd9b3";
            ctx.beginPath();
            ctx.ellipse(0, 0, 25, 30, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // 脸部特征
            ctx.fillStyle = "#333";
            
            // 眼睛
            ctx.beginPath();
            ctx.ellipse(-8, -5, 4, 5, 0, 0, Math.PI * 2);
            ctx.ellipse(8, -5, 4, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // 嘴巴
            ctx.beginPath();
            ctx.arc(0, 10, 8, 0, Math.PI, false);
            ctx.stroke();
            
            // 鼻子
            ctx.fillStyle = "#ffb380";
            ctx.beginPath();
            ctx.ellipse(0, 0, 3, 4, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }
        
        // 绘制手
        function drawHand(handPose, isLeft) {
            const shoulderX = canvas.width / 2 + (isLeft ? -40 : 40);
            const shoulderY = canvas.height / 2 - 40;
            
            const handX = shoulderX + handPose.x;
            const handY = shoulderY + handPose.y;
            
            // 绘制手臂
            ctx.strokeStyle = "#4a4a6d";
            ctx.lineWidth = 12;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(shoulderX, shoulderY);
            
            // 添加一些弯曲效果
            const midX = (shoulderX + handX) / 2 + (isLeft ? -10 : 10);
            const midY = (shoulderY + handY) / 2;
            
            ctx.quadraticCurveTo(midX, midY, handX, handY);
            ctx.stroke();
            
            // 绘制手
            ctx.save();
            ctx.translate(handX, handY);
            ctx.rotate(handPose.angle * Math.PI / 180);
            
            ctx.fillStyle = "#ffd9b3";
            ctx.beginPath();
            if (isLeft) {
                ctx.ellipse(0, 0, 10, 8, 0, 0, Math.PI * 2);
            } else {
                ctx.ellipse(0, 0, 10, 8, 0, 0, Math.PI * 2);
            }
            ctx.fill();
            
            ctx.restore();
        }
        
        // 绘制信息
        function drawInfo(time) {
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
            ctx.font = "16px 'Segoe UI', sans-serif";
            ctx.textAlign = "left";
            ctx.fillText(`舞蹈: ${currentScript.name}`, 20, 30);
            ctx.fillText(`时间: ${time.toFixed(0)}ms / ${currentScript.duration}ms`, 20, 55);
            ctx.fillText(`关键帧: ${currentScript.keyframes.length}个`, 20, 80);
            
            // 绘制当前姿势信息
            const pose = getPoseAtTime(time);
            ctx.font = "14px 'Segoe UI', sans-serif";
            ctx.fillText(`头部: x=${pose.head.x.toFixed(1)}, y=${pose.head.y.toFixed(1)}, 角度=${pose.head.angle.toFixed(1)}°`, 20, 110);
            ctx.fillText(`左手: x=${pose.leftHand.x.toFixed(1)}, y=${pose.leftHand.y.toFixed(1)}, 角度=${pose.leftHand.angle.toFixed(1)}°`, 20, 130);
            ctx.fillText(`右手: x=${pose.rightHand.x.toFixed(1)}, y=${pose.rightHand.y.toFixed(1)}, 角度=${pose.rightHand.angle.toFixed(1)}°`, 20, 150);
            
            // 绘制脚本格式说明
            ctx.textAlign = "right";
            ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
            ctx.font = "12px 'Segoe UI', sans-serif";
            ctx.fillText("舞蹈脚本格式: JSON | 支持: 头部(x,y,angle) + 双手(x,y,angle)", canvas.width - 20, canvas.height - 20);
        }
        
        // 获取指定时间的姿势
        function getPoseAtTime(time) {
            // 确保时间在范围内
            time = Math.max(0, Math.min(time, currentScript.duration));
            
            // 找到前后关键帧
            let prevFrame = null;
            let nextFrame = null;
            
            for (let i = 0; i < currentScript.keyframes.length; i++) {
                if (currentScript.keyframes[i].time <= time) {
                    prevFrame = currentScript.keyframes[i];
                }
                if (currentScript.keyframes[i].time >= time && !nextFrame) {
                    nextFrame = currentScript.keyframes[i];
                }
            }
            
            // 如果只有前一帧或后一帧
            if (!prevFrame) prevFrame = nextFrame;
            if (!nextFrame) nextFrame = prevFrame;
            
            // 如果前后帧相同，直接返回
            if (prevFrame === nextFrame) {
                return {
                    head: {...prevFrame.head},
                    leftHand: {...prevFrame.leftHand},
                    rightHand: {...prevFrame.rightHand}
                };
            }
            
            // 计算插值比例
            const timeDiff = nextFrame.time - prevFrame.time;
            const t = timeDiff > 0 ? (time - prevFrame.time) / timeDiff : 0;
            
            // 线性插值
            return {
                head: interpolatePose(prevFrame.head, nextFrame.head, t),
                leftHand: interpolatePose(prevFrame.leftHand, nextFrame.leftHand, t),
                rightHand: interpolatePose(prevFrame.rightHand, nextFrame.rightHand, t)
            };
        }
        
        // 插值姿势
        function interpolatePose(pose1, pose2, t) {
            // 角度插值需要考虑最短路径
            let angleDiff = pose2.angle - pose1.angle;
            if (Math.abs(angleDiff) > 180) {
                if (angleDiff > 0) {
                    angleDiff -= 360;
                } else {
                    angleDiff += 360;
                }
            }
            
            return {
                x: pose1.x + (pose2.x - pose1.x) * t,
                y: pose1.y + (pose2.y - pose1.y) * t,
                angle: pose1.angle + angleDiff * t
            };
        }
        
        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
