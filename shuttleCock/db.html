<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>火柴人踢毽子动画 - 面向对象重构版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        // Tailwind配置
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#FF7D00',
                        neutral: '#F5F7FA',
                        dark: '#1D2129',
                    },
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            overflow: hidden;
            font-family: 'Inter', system-ui, sans-serif;
        }
        
        canvas {
            display: block;
            background-color: #F5F7FA;
            transition: background-color 0.3s ease;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .toolbar-btn {
            transition: all 0.2s ease;
        }
        
        .toolbar-btn:hover {
            transform: translateY(-2px);
            background-color: rgba(22, 93, 255, 0.9);
        }
        
        /* 新增：键盘控制提示样式 */
        .keyboard-hint {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 20;
            transition: opacity 0.3s ease;
        }
        
        .keyboard-hint .player1,
        .keyboard-hint .player2 {
            padding: 2px 8px;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s ease;
            border: none;
            min-width: 28px;
        }
        
        .keyboard-hint .player1:active,
        .keyboard-hint .player2:active {
            transform: scale(0.95);
            opacity: 0.8;
        }
        
        .keyboard-hint .player1.pressed,
        .keyboard-hint .player2.pressed {
            background: #000 !important;
            transform: scale(0.95);
        }
        
        .keyboard-hint .player1 { 
            background: #165DFF; 
        }
        
        .keyboard-hint .player2 {
            background: #FF7D00;
        }
    </style>
</head>
<body class="bg-neutral font-inter text-dark antialiased">
    <!-- 顶部工具条 -->
    <header class="bg-white shadow-md z-10 relative">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fa fa-paint-brush text-primary text-xl"></i>
                <h1 class="text-lg font-semibold text-dark">火柴人动画
                     <span class="text-primary">踢毽子v0.12</span></h1>
            </div>
            
            <div class="flex items-center gap-2">
                <button id="bgToggle" class="toolbar-btn px-3 py-1.5 bg-primary text-white rounded-md flex items-center gap-2">
                    <i class="fa fa-moon-o"></i>
                    <span>深色模式</span>
                </button>
                <button id="speedUp" class="toolbar-btn px-3 py-1.5 bg-primary text-white rounded-md flex items-center gap-2">
                    <i class="fa fa-forward"></i>
                    <span>加速</span>
                </button>
                <button id="speedDown" class="toolbar-btn px-3 py-1.5 bg-primary text-white rounded-md flex items-center gap-2">
                    <i class="fa fa-backward"></i>
                    <span>减速</span>
                </button>
                <button id="restart" class="toolbar-btn px-3 py-1.5 bg-secondary text-white rounded-md flex items-center gap-2">
                    <i class="fa fa-refresh"></i>
                    <span>重置</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 中间画布区域 -->
    <main class="flex-1 flex items-center justify-center min-h-[calc(100vh-112px)] p-4 relative">
        <canvas id="animationCanvas" class="rounded-lg shadow-lg max-w-full max-h-full"></canvas>
        
        <!-- 新增：键盘控制提示 -->
        <div class="keyboard-hint">
            玩家1控制: <button class="player1" id="btnF">F</button> 左 <button class="player1" id="btnG">G</button> 右 | 
            玩家2控制: <button class="player2" id="btnJ">J</button> 左 <button class="player2" id="btnK">K</button> 右
        </div>
    </main>

    <!-- 底部状态栏 -->
    <footer class="bg-white shadow-md z-10 py-2">
        <div class="container mx-auto px-4 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2">
                    <i class="fa fa-clock-o text-primary"></i>
                    <span id="animationTime" class="text-sm">动画时长: 00:00</span>
                </div>
                <div class="flex items-center gap-2">
                    <i class="fa fa-bolt text-secondary"></i>
                    <span id="animationSpeed" class="text-sm">速度: 1.0x</span>
                </div>
                <div class="flex items-center gap-2">
                    <i class="fa fa-circle text-green-500 animate-pulse"></i>
                    <span id="animationStatus" class="text-sm">动画运行中</span>
                </div>
            </div>
            <div class="text-sm text-gray-500">
                火柴人踢毽子 &copy; 2025
            </div>
        </div>
    </footer>

    <script>
        // ==================== 常量定义 ====================
        const CTHEMES = {
            LIGHT: {
                bg: '#F5F7FA',
                stickman1: '#165DFF',
                stickman2: '#FF7D00',
                shuttlecock: '#E63946',
                ground: '#333333'
            },
            DARK: {
                bg: '#1D2129',
                stickman1: '#4080FF',
                stickman2: '#FF9500',
                shuttlecock: '#FF5252',
                ground: '#666666'
            }
        };

        const CANIMATION_SETTINGS = {
            INITIAL_SPEED: 1.0,
            MIN_SPEED: 0.5,
            MAX_SPEED: 2.0,
            SPEED_STEP: 0.1,
            GROUND_HEIGHT_RATIO: 0.7,
            CANVAS_ASPECT_RATIO: 16/9,
            REST_VELOCITY_THRESHOLD: 0.1, // 静止速度阈值
            GROUND_FRICTION: 0.95, // 地面摩擦力
            MAX_BOUNCES: 2, // 最大弹跳次数
            // 新增：移动相关配置
            MOVEMENT_SPEED: 5, // 基础移动速度
            MOVEMENT_BOUNDARY: 50, // 离画布边缘的最小距离
            KEY_PRESS_STATE: { // 键盘按键状态
                f: false,
                g: false,
                j: false,
                k: false
            }
        };

        // ==================== 工具类 ====================
        class CUtils {
            static formatTime(seconds) {
                const minutes = Math.floor(seconds / 60).toString().padStart(2, '0');
                const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
                return `${minutes}:${secs}`;
            }
            
            static clamp(value, min, max) {
                return Math.max(min, Math.min(max, value));
            }
        }

        // ==================== 火柴人类 ====================
        class CStickman {
            constructor(x, y, color, isRightSide = false) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.isRightSide = isRightSide;
                
                this.height = 100;
                this.width = 20;
                this.headSize = 20;
                this.legAngle = 0;
                this.armAngle = 0;
                this.kickPhase = 0;
                this.kickSpeed = 0.02;
                this.isActive = true; // 新增：是否处于活跃状态
                
                // 新增：移动相关属性
                this.movementSpeed = CANIMATION_SETTINGS.MOVEMENT_SPEED;
                this.moveDirection = 0; // -1: 左, 0: 不动, 1: 右
            }
            
            update(deltaTime, speedFactor, isShuttlecockResting = false) {
                // 如果毽子静止，火柴人动作变慢
                const kickSpeed = isShuttlecockResting ? this.kickSpeed * 0.2 : this.kickSpeed;
                this.kickPhase += kickSpeed * speedFactor;
                this.legAngle = Math.sin(this.kickPhase * 2) * 0.8;
                this.armAngle = Math.sin(this.kickPhase * 2 + Math.PI) * 0.6;
                
                // 如果毽子静止，火柴人动作幅度减小
                if (isShuttlecockResting) {
                    this.legAngle *= 0.3;
                    this.armAngle *= 0.3;
                }
                
                // 新增：更新位置（移动）
                if (this.moveDirection !== 0 && !isShuttlecockResting) {
                    const moveStep = this.movementSpeed * speedFactor * this.moveDirection;
                    this.x += moveStep;
                }
            }
            
            // 新增：设置移动方向
            setMoveDirection(direction) {
                this.moveDirection = direction;
            }
            
            // 新增：限制移动边界
            clampPosition(minX, maxX) {
                this.x = CUtils.clamp(this.x, minX, maxX);
            }
            
            draw(ctx) {
                ctx.save();
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                
                // 头部
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.headSize, 0, Math.PI * 2);
                ctx.stroke();
                
                // 身体
                ctx.beginPath();
                ctx.moveTo(this.x, this.y + this.headSize);
                ctx.lineTo(this.x, this.y + this.height);
                ctx.stroke();
                
                // 腿部
                this.drawLegs(ctx);
                
                // 手臂
                this.drawArms(ctx);
                
                // 面部
                this.drawFace(ctx);
                
                ctx.restore();
            }
            
            drawLegs(ctx) {
                const legLength = this.height * 0.6;
                const legX1 = this.x;
                const legY1 = this.y + this.height;
                
                // 左腿
                const legAngle = this.isRightSide ? -this.legAngle * 0.8 : this.legAngle;
                const legX2 = legX1 + Math.sin(legAngle) * legLength;
                const legY2 = legY1 + Math.cos(legAngle) * legLength;
                
                ctx.beginPath();
                ctx.moveTo(legX1, legY1);
                ctx.lineTo(legX2, legY2);
                ctx.stroke();
                
                // 右腿
                const legAngle2 = this.isRightSide ? this.legAngle * 0.9 : -this.legAngle * 0.8;
                const legX3 = legX1 + Math.sin(legAngle2) * legLength * 0.9;
                const legY3 = legY1 + Math.cos(legAngle2) * legLength * 0.9;
                
                ctx.beginPath();
                ctx.moveTo(legX1, legY1);
                ctx.lineTo(legX3, legY3);
                ctx.stroke();
            }
            
            drawArms(ctx) {
                const armLength = this.height * 0.5;
                const armX1 = this.x;
                const armY1 = this.y + this.height * 0.3;
                
                // 左臂
                const armAngle = this.isRightSide ? -this.armAngle * 0.9 : this.armAngle;
                const armX2 = armX1 + Math.sin(armAngle) * armLength;
                const armY2 = armY1 + Math.cos(armAngle) * armLength;
                
                ctx.beginPath();
                ctx.moveTo(armX1, armY1);
                ctx.lineTo(armX2, armY2);
                ctx.stroke();
                
                // 右臂
                const armAngle2 = this.isRightSide ? this.armAngle : -this.armAngle * 0.9;
                const armX3 = armX1 + Math.sin(armAngle2) * armLength;
                const armY3 = armY1 + Math.cos(armAngle2) * armLength;
                
                ctx.beginPath();
                ctx.moveTo(armX1, armY1);
                ctx.lineTo(armX3, armY3);
                ctx.stroke();
            }
            
            drawFace(ctx) {
                ctx.fillStyle = this.color;
                
                // 眼睛
                const eyeOffsetX = this.headSize * 0.3;
                const eyeOffsetY = -this.headSize * 0.2;
                
                ctx.beginPath();
                ctx.arc(this.x - eyeOffsetX, this.y + eyeOffsetY, 2, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.beginPath();
                ctx.arc(this.x + eyeOffsetX, this.y + eyeOffsetY, 2, 0, Math.PI * 2);
                ctx.fill();
                
                // 嘴巴
                ctx.beginPath();
                ctx.arc(this.x, this.y + this.headSize * 0.2, this.headSize * 0.3, 0, Math.PI);
                ctx.stroke();
            }
            
            getFootPosition() {
                const legLength = this.height * 0.6;
                const legAngle = this.isRightSide ? -this.legAngle * 0.8 : this.legAngle;
                return {
                    x: this.x + Math.sin(legAngle) * legLength,
                    y: this.y + this.height + Math.cos(legAngle) * legLength
                };
            }
            
            reposition(x, y) {
                this.x = x;
                this.y = y;
                this.isActive = true; // 重置活跃状态
                this.moveDirection = 0; // 重置移动方向
            }
        }

        // ==================== 毽子类 ====================
        class CShuttlecock {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 15;
                this.velocityX = 0;
                this.velocityY = 0;
                this.color = CTHEMES.LIGHT.shuttlecock;
                
                this.gravity = 0.2;
                this.bounce = -0.8;
                this.airResistance = 0.99;
                this.owner = 1; // 1: 火柴人1, 2: 火柴人2
                this.bounceCount = 0; // 新增：弹跳次数
                this.isResting = false; // 新增：是否静止在地面
            }
            
            update(deltaTime, speedFactor, canvasWidth, canvasHeight) {
                if (this.isResting) return; // 如果已经静止，不再更新
                
                const groundY = canvasHeight * CANIMATION_SETTINGS.GROUND_HEIGHT_RATIO - this.size;
                
                // 应用物理
                this.velocityY += this.gravity * speedFactor;
                this.velocityX *= this.airResistance;
                this.velocityY *= this.airResistance;
                
                // 更新位置
                this.x += this.velocityX * speedFactor;
                this.y += this.velocityY * speedFactor;
                
                // 边界碰撞检测
                this.handleBoundaryCollision(groundY, canvasWidth);
                
                // 检查是否应该静止
                this.checkIfResting(groundY);
            }
            
            handleBoundaryCollision(groundY, canvasWidth) {
                // 地面碰撞
                if (this.y > groundY) {
                    this.y = groundY;
                    
                    // 限制弹跳次数
                    if (this.bounceCount < CANIMATION_SETTINGS.MAX_BOUNCES) {
                        this.velocityY *= this.bounce * (1 - this.bounceCount * 0.2); // 每次弹跳减弱
                        this.bounceCount++;
                    } else {
                        // 超过最大弹跳次数，不再弹跳
                        this.velocityY = 0;
                    }
                    
                    // 应用地面摩擦力
                    this.velocityX *= CANIMATION_SETTINGS.GROUND_FRICTION;
                }
                
                // 左右边界
                if (this.x < this.size) {
                    this.x = this.size;
                    this.velocityX *= this.bounce * 0.5; // 墙面碰撞减弱
                } else if (this.x > canvasWidth - this.size) {
                    this.x = canvasWidth - this.size;
                    this.velocityX *= this.bounce * 0.5;
                }
            }
            
            checkIfResting(groundY) {
                // 如果在地面上且速度足够小，则静止
                if (this.y >= groundY - 1 && 
                    Math.abs(this.velocityX) < CANIMATION_SETTINGS.REST_VELOCITY_THRESHOLD && 
                    Math.abs(this.velocityY) < CANIMATION_SETTINGS.REST_VELOCITY_THRESHOLD) {
                    this.isResting = true;
                    this.velocityX = 0;
                    this.velocityY = 0;
                }
            }
            
            draw(ctx) {
                ctx.save();
                
                // 毽子主体
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                // 羽毛 - 如果静止，羽毛也静止
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                const featherLength = this.size * 1.5;
                
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2 + (this.isResting ? 0 : Date.now() * 0.001);
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(
                        this.x + Math.cos(angle) * featherLength,
                        this.y + Math.sin(angle) * featherLength
                    );
                    ctx.stroke();
                }
                
                ctx.restore();
            }
            
            isCollidingWithStickman(stickman) {
                if (this.isResting) return false; // 静止后不再碰撞
                const foot = stickman.getFootPosition();
                const distance = Math.hypot(this.x - foot.x, this.y - foot.y);
                return distance < this.size + 10;
            }
            
            kick(stickman, owner) {
                if (this.isResting) return; // 静止后不能被踢
                const foot = stickman.getFootPosition();
                const directionMultiplier = stickman.isRightSide ? -1 : 1;
                
                this.velocityX = (this.x - foot.x) * 0.3 + 4 * directionMultiplier;
                this.velocityY = (this.y - foot.y) * 0.3 - 8;
                this.owner = owner;
                this.bounceCount = 0; // 重置弹跳次数
            }
            
            reposition(x, y, velocityX = null, velocityY = -8) {
                this.x = x;
                this.y = y;
                this.velocityX = velocityX !== null ? velocityX : (Math.random() > 0.5 ? 3 : -3);
                this.velocityY = velocityY;
                this.bounceCount = 0; // 重置弹跳次数
                this.isResting = false; // 重置静止状态
            }
            
            setColor(color) {
                this.color = color;
            }
            
            isRestingOnGround() {
                return this.isResting;
            }
        }

        // ==================== 动画控制器类 ====================
        class CAnimationController {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                
                this.stickmen = [];
                this.shuttlecock = null;
                this.animationSpeed = CANIMATION_SETTINGS.INITIAL_SPEED;
                this.animationTime = 0;
                this.lastTimestamp = 0;
                this.animationFrame = null;
                this.isDarkMode = false;
                this.currentTheme = CTHEMES.LIGHT;
                
                // 新增：初始化键盘状态
                this.keyStates = { ...CANIMATION_SETTINGS.KEY_PRESS_STATE };
                
                this.init();
            }
            
            init() {
                this.resizeCanvas();
                this.createGameObjects();
                this.setupEventListeners();
                // 新增：设置键盘事件监听
                this.setupKeyboardListeners();
                // 新增：设置按钮控制监听
                this.setupButtonControls();
                this.startAnimation();
            }
            
            createGameObjects() {
                // 创建两个火柴人
                const stickman1 = new CStickman(
                    this.canvas.width * 0.3,
                    this.canvas.height * CANIMATION_SETTINGS.GROUND_HEIGHT_RATIO - 100,
                    this.currentTheme.stickman1,
                    false
                );
                
                const stickman2 = new CStickman(
                    this.canvas.width * 0.7,
                    this.canvas.height * CANIMATION_SETTINGS.GROUND_HEIGHT_RATIO - 100,
                    this.currentTheme.stickman2,
                    true
                );
                
                this.stickmen = [stickman1, stickman2];
                
                // 创建毽子
                this.shuttlecock = new CShuttlecock(
                    this.canvas.width * 0.5,
                    this.canvas.height * 0.5
                );
                
                // 设置毽子初始速度
                this.shuttlecock.velocityX = 3 * (Math.random() > 0.5 ? 1 : -1);
                this.shuttlecock.velocityY = -8;
                this.shuttlecock.setColor(this.currentTheme.shuttlecock);
            }
            
            resizeCanvas() {
                const container = this.canvas.parentElement;
                const containerWidth = container.clientWidth;
                const containerHeight = container.clientHeight;
                
                const aspectRatio = CANIMATION_SETTINGS.CANVAS_ASPECT_RATIO;
                let width = containerWidth;
                let height = containerHeight;
                
                if (width / height > aspectRatio) {
                    width = height * aspectRatio;
                } else {
                    height = width / aspectRatio;
                }
                
                this.canvas.width = width;
                this.canvas.height = height;
                
                this.repositionObjects();
            }
            
            repositionObjects() {
                if (this.stickmen.length >= 2 && this.shuttlecock) {
                    this.stickmen[0].reposition(
                        this.canvas.width * 0.3,
                        this.canvas.height * CANIMATION_SETTINGS.GROUND_HEIGHT_RATIO - 100
                    );
                    
                    this.stickmen[1].reposition(
                        this.canvas.width * 0.7,
                        this.canvas.height * CANIMATION_SETTINGS.GROUND_HEIGHT_RATIO - 100
                    );
                    
                    this.shuttlecock.reposition(
                        this.canvas.width * 0.5,
                        this.canvas.height * 0.5
                    );
                }
            }
            
            // 新增：更新火柴人移动方向
            updateStickmanMovement() {
                const isShuttlecockResting = this.shuttlecock.isRestingOnGround();
                if (isShuttlecockResting) return;
                
                // 玩家1（左边火柴人）：F左 G右
                let p1Direction = 0;
                if (this.keyStates.f) p1Direction -= 1;
                if (this.keyStates.g) p1Direction += 1;
                this.stickmen[0].setMoveDirection(p1Direction);
                
                // 玩家2（右边火柴人）：J左 K右
                let p2Direction = 0;
                if (this.keyStates.j) p2Direction -= 1;
                if (this.keyStates.k) p2Direction += 1;
                this.stickmen[1].setMoveDirection(p2Direction);
                
                // 限制火柴人移动边界
                const boundary = CANIMATION_SETTINGS.MOVEMENT_BOUNDARY;
                const centerDivider = this.canvas.width / 2;
                
                // 左边火柴人不能超过中线
                this.stickmen[0].clampPosition(
                    boundary,
                    centerDivider - boundary
                );
                
                // 右边火柴人不能超过中线
                this.stickmen[1].clampPosition(
                    centerDivider + boundary,
                    this.canvas.width - boundary
                );
            }
            
            update(deltaTime) {
                const speedFactor = deltaTime * this.animationSpeed;
                const isShuttlecockResting = this.shuttlecock.isRestingOnGround();
                
                // 新增：更新火柴人移动
                this.updateStickmanMovement();
                
                // 更新火柴人（传入毽子是否静止的状态）
                this.stickmen.forEach(stickman => {
                    stickman.update(deltaTime, speedFactor, isShuttlecockResting);
                });
                
                // 更新毽子
                this.shuttlecock.update(
                    deltaTime,
                    speedFactor,
                    this.canvas.width,
                    this.canvas.height
                );
                
                // 检测碰撞
                this.checkCollisions();
                
                // 更新状态显示
                this.updateAnimationStatus(isShuttlecockResting);
            }
            
            checkCollisions() {
                // 检测火柴人1踢毽子
                if (this.shuttlecock.isCollidingWithStickman(this.stickmen[0]) && this.shuttlecock.owner !== 1) {
                    this.shuttlecock.kick(this.stickmen[0], 1);
                }
                
                // 检测火柴人2踢毽子
                if (this.shuttlecock.isCollidingWithStickman(this.stickmen[1]) && this.shuttlecock.owner !== 2) {
                    this.shuttlecock.kick(this.stickmen[1], 2);
                }
            }
            
            draw() {
                // 清空画布
                this.ctx.fillStyle = this.currentTheme.bg;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // 绘制地面
                this.drawGround();
                
                // 绘制所有对象
                this.shuttlecock.draw(this.ctx);
                this.stickmen.forEach(stickman => stickman.draw(this.ctx));
                
                // 如果毽子静止，绘制提示文字
                if (this.shuttlecock.isRestingOnGround()) {
                    this.drawRestingText();
                }
            }
            
            drawGround() {
                this.ctx.strokeStyle = this.currentTheme.ground;
                this.ctx.lineWidth = 4;
                this.ctx.beginPath();
                this.ctx.moveTo(0, this.canvas.height * CANIMATION_SETTINGS.GROUND_HEIGHT_RATIO);
                this.ctx.lineTo(this.canvas.width, this.canvas.height * CANIMATION_SETTINGS.GROUND_HEIGHT_RATIO);
                this.ctx.stroke();
            }
            
            drawRestingText() {
                this.ctx.save();
                this.ctx.font = 'bold 20px Inter, sans-serif';
                this.ctx.fillStyle = this.currentTheme.shuttlecock;
                this.ctx.textAlign = 'center';
                this.ctx.globalAlpha = 0.8;
                this.ctx.fillText(
                    '毽子已落地，点击重置重新开始',
                    this.canvas.width / 2,
                    this.canvas.height * 0.2
                );
                this.ctx.restore();
            }
            
            animate(timestamp) {
                if (!this.lastTimestamp) this.lastTimestamp = timestamp;
                const deltaTime = timestamp - this.lastTimestamp;
                this.lastTimestamp = timestamp;
                
                this.update(deltaTime / 16);
                this.draw();
                
                this.animationTime += deltaTime / 1000;
                this.updateStatusBar();
                
                this.animationFrame = requestAnimationFrame(this.animate.bind(this));
            }
            
            startAnimation() {
                this.animationTime = 0;
                this.lastTimestamp = 0;
                cancelAnimationFrame(this.animationFrame);
                this.animate(0);
            }
            
            restart() {
                this.animationTime = 0;
                this.repositionObjects();
                this.startAnimation();
                // 更新状态显示
                document.getElementById('animationStatus').innerHTML = 
                    '<i class="fa fa-circle text-green-500 animate-pulse"></i><span class="text-sm">动画运行中</span>';
            }
            
            setSpeed(speed) {
                this.animationSpeed = CUtils.clamp(
                    speed,
                    CANIMATION_SETTINGS.MIN_SPEED,
                    CANIMATION_SETTINGS.MAX_SPEED
                );
                this.updateStatusBar();
            }
            
            adjustSpeed(amount) {
                this.setSpeed(this.animationSpeed + amount);
            }
            
            toggleTheme() {
                this.isDarkMode = !this.isDarkMode;
                this.currentTheme = this.isDarkMode ? CTHEMES.DARK : CTHEMES.LIGHT;
                
                // 更新毽子颜色
                this.shuttlecock.setColor(this.currentTheme.shuttlecock);
                
                // 更新火柴人颜色
                this.stickmen[0].color = this.currentTheme.stickman1;
                this.stickmen[1].color = this.currentTheme.stickman2;
                
                // 更新UI
                this.updateThemeUI();
                
                // 更新键盘提示颜色
                this.updateKeyboardHintColors();
            }
            
            updateThemeUI() {
                const bgToggleBtn = document.getElementById('bgToggle');
                const icon = bgToggleBtn.querySelector('i');
                const text = bgToggleBtn.querySelector('span');
                
                if (this.isDarkMode) {
                    icon.className = 'fa fa-sun-o';
                    text.textContent = '浅色模式';
                } else {
                    icon.className = 'fa fa-moon-o';
                    text.textContent = '深色模式';
                }
                
                this.canvas.style.backgroundColor = this.currentTheme.bg;
            }
            
            // 新增：更新键盘提示颜色
            updateKeyboardHintColors() {
                const hint = document.querySelector('.keyboard-hint');
                if (this.isDarkMode) {
                    hint.style.background = 'rgba(255,255,255,0.9)';
                    hint.style.color = '#1D2129';
                } else {
                    hint.style.background = 'rgba(0,0,0,0.7)';
                    hint.style.color = 'white';
                }
            }
            
            updateStatusBar() {
                document.getElementById('animationTime').textContent = 
                    `动画时长: ${CUtils.formatTime(this.animationTime)}`;
                document.getElementById('animationSpeed').textContent = 
                    `速度: ${this.animationSpeed.toFixed(1)}x`;
            }
            
            updateAnimationStatus(isShuttlecockResting) {
                const statusElement = document.getElementById('animationStatus');
                if (isShuttlecockResting) {
                    statusElement.innerHTML = 
                        '<i class="fa fa-circle text-red-500"></i><span class="text-sm">毽子已落地</span>';
                } else {
                    statusElement.innerHTML = 
                        '<i class="fa fa-circle text-green-500 animate-pulse"></i><span class="text-sm">动画运行中</span>';
                }
            }
            
            setupEventListeners() {
                window.addEventListener('resize', () => {
                    this.resizeCanvas();
                });
                
                document.getElementById('bgToggle').addEventListener('click', () => {
                    this.toggleTheme();
                });
                
                document.getElementById('speedUp').addEventListener('click', () => {
                    this.adjustSpeed(CANIMATION_SETTINGS.SPEED_STEP);
                });
                
                document.getElementById('speedDown').addEventListener('click', () => {
                    this.adjustSpeed(-CANIMATION_SETTINGS.SPEED_STEP);
                });
                
                document.getElementById('restart').addEventListener('click', () => {
                    this.restart();
                });
            }
            
            // 新增：设置键盘事件监听
            setupKeyboardListeners() {
                // 按键按下
                document.addEventListener('keydown', (e) => {
                    const key = e.key.toLowerCase();
                    if (this.keyStates.hasOwnProperty(key)) {
                        this.keyStates[key] = true;
                        // 更新按钮视觉状态
                        this.updateButtonVisualState(key, true);
                        e.preventDefault(); // 防止页面滚动
                    }
                });
                
                // 按键释放
                document.addEventListener('keyup', (e) => {
                    const key = e.key.toLowerCase();
                    if (this.keyStates.hasOwnProperty(key)) {
                        this.keyStates[key] = false;
                        // 更新按钮视觉状态
                        this.updateButtonVisualState(key, false);
                        e.preventDefault();
                    }
                });
                
                // 失去焦点时重置按键状态
                window.addEventListener('blur', () => {
                    Object.keys(this.keyStates).forEach(key => {
                        this.keyStates[key] = false;
                        this.updateButtonVisualState(key, false);
                    });
                });
            }
            
            // 新增：设置按钮控制监听
            setupButtonControls() {
                const buttons = {
                    'btnF': 'f',
                    'btnG': 'g',
                    'btnJ': 'j',
                    'btnK': 'k'
                };
                
                // 为每个按钮添加鼠标事件
                Object.entries(buttons).forEach(([btnId, key]) => {
                    const btn = document.getElementById(btnId);
                    if (btn) {
                        // 鼠标按下
                        btn.addEventListener('mousedown', (e) => {
                            e.preventDefault();
                            this.keyStates[key] = true;
                            this.updateButtonVisualState(key, true);
                        });
                        
                        // 鼠标释放
                        btn.addEventListener('mouseup', () => {
                            this.keyStates[key] = false;
                            this.updateButtonVisualState(key, false);
                        });
                        
                        // 鼠标离开
                        btn.addEventListener('mouseleave', () => {
                            this.keyStates[key] = false;
                            this.updateButtonVisualState(key, false);
                        });
                        
                        // 触摸事件支持
                        btn.addEventListener('touchstart', (e) => {
                            e.preventDefault();
                            this.keyStates[key] = true;
                            this.updateButtonVisualState(key, true);
                        });
                        
                        btn.addEventListener('touchend', () => {
                            this.keyStates[key] = false;
                            this.updateButtonVisualState(key, false);
                        });
                    }
                });
            }
            
            // 新增：更新按钮视觉状态
            updateButtonVisualState(key, isPressed) {
                const btnIds = {
                    'f': 'btnF',
                    'g': 'btnG',
                    'j': 'btnJ',
                    'k': 'btnK'
                };
                
                const btnId = btnIds[key];
                if (btnId) {
                    const btn = document.getElementById(btnId);
                    if (btn) {
                        if (isPressed) {
                            btn.classList.add('pressed');
                        } else {
                            btn.classList.remove('pressed');
                        }
                    }
                }
            }
        }

        // ==================== 初始化应用 ====================
        let animationController;

        document.addEventListener('DOMContentLoaded', () => {
            animationController = new CAnimationController('animationCanvas');
        });
    </script>
</body>
</html>
